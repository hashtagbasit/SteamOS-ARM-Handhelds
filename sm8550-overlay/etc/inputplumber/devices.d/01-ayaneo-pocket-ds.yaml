# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYANEO Pocket DS (SM8550) → virtual Steam Deck controller.
# The DS pad runs in DirectInput mode ("AYANEO Controller" 4001:0428) with its
# own button layout (Home on BTN_START, Start on BTN6, see
# ayaneo_pocketds_deck); its extra keys arrive on "AYANEO DEVICE" 1c4f:0002.
# Untested on hardware so far.
version: 1
kind: CompositeDevice
name: AYANEO Pocket DS

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket DS

single_source: false

source_devices:
  - group: gamepad
    evdev:
      vendor_id: "4001"
      product_id: "0428"
      handler: event*
    capability_map_id: ayaneo_pocketds_deck
  - group: gamepad
    hidraw:
      vendor_id: 0x4001
      product_id: 0x0428
      interface_num: 0
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    # Two event devices (input0 and input1): both join this controller.
    # With the default unique: true the second one became a second
    # virtual pad (two controllers, A/B "swapping" on the Pocket DMG).
    unique: false
    capability_map_id: ayaneo_pocketds_deck
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: ayaneo_sm8550_deck

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
