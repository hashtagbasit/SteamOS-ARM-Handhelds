# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYN Odin 2 Portal ONLY. Split out of 02-ayn-odin.yaml: live evtest capture
# on a physical Odin 2 Portal confirmed A/B are standard (A=BTN_SOUTH,
# B=BTN_EAST), unlike the base AYN Odin 2 the shared ayn_mcu map was tuned
# for, but X/Y are still swapped (X=BTN_WEST, Y=BTN_NORTH). Using ayn_mcu
# on the Portal made A/B appear switched. See ayn_portal_mcu.yaml for the
# corrected mapping (A/B passed through, X/Y swap kept).
#
# Do not list USB/BT as ignore sources: deck-uhid is USB (VID 28de) and
# matching it as a source restarts the composite in a loop (cursor, no Steam).
# External HID is handled by sm8550-inputplumber-ext-hid (drop keyboard target).
version: 1
kind: CompositeDevice
name: AYN Odin 2 Portal

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Portal

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_portal_mcu
    passthrough: false

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
