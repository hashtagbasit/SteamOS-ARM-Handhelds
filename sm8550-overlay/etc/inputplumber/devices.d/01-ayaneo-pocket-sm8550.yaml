# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYANEO Pocket EVO / S 1K / S 2K (SM8550) → virtual Steam Deck controller.
# XInput pad (045e:028e) plus the "AYANEO DEVICE" (1c4f:0002) for the extra
# keys. The EVO also has side keys on
# "aya-keys" (F13-F16). Untested on hardware so far.
version: 1
kind: CompositeDevice
name: AYANEO Pocket (SM8550)

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket EVO
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket S 1K
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket S 2K

single_source: false

source_devices:
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    # Two event devices (input0 and input1): both join this controller.
    # With the default unique: true the second one became a second
    # virtual pad (two controllers, A/B "swapping" on the Pocket DMG).
    unique: false
    capability_map_id: ayaneo_sm8550_deck
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: ayaneo_sm8550_deck
  # Firmware that boots the pad in DirectInput mode, like the Pocket S2.
  - group: gamepad
    evdev:
      vendor_id: "4001"
      product_id: "0428"
      handler: event*
    capability_map_id: konkr_pocketfit_dinput
  - group: gamepad
    hidraw:
      vendor_id: 0x4001
      product_id: 0x0428
      interface_num: 0
  - group: keyboard
    evdev:
      name: aya-keys
      handler: event*
    capability_map_id: ayaneo_pocket_evo_keys

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
