version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: gradle
    directory: /android-installer
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      gradle:
        patterns:
          - '*'
