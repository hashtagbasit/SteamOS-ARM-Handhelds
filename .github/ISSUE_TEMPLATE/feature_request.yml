name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is currently difficult or missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the feature could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches that were tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots or device-specific details.
