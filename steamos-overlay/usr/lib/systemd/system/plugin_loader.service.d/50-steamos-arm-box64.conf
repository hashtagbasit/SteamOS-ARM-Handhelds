# Decky's PluginLoader runs as the native aarch64 build (PluginLoader-arm64,
# Decky 3.3.0+). The x86-64 build under box64 can't load Python 3.14's _ssl and
# crash-looped. Updating Decky from its settings writes Decky's own unit to
# /etc/systemd/system, which wins over ours in /usr/lib and drops our
# settings: Decky disappears from Quick Access. A drop-in applies on top of
# whichever unit file wins, so it carries everything the loader needs, and
# KEEP_SYSTEMD_SERVICE stops the next update from replacing the unit at all.
# (File name kept so image updates overwrite the old box64 version.)
[Unit]
After=network-online.target local-fs.target home.mount
Wants=network-online.target

[Service]
ExecStart=
ExecStart=/home/steamos/homebrew/services/PluginLoader
WorkingDirectory=/home/steamos/homebrew/services
Environment=UNPRIVILEGED_PATH=/home/steamos/homebrew
Environment=PRIVILEGED_PATH=/home/steamos/homebrew
Environment=HOME=/home/steamos
Environment=USER=steamos
Environment=XDG_CONFIG_HOME=/home/steamos/.config
Environment=XDG_DATA_HOME=/home/steamos/.local/share
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=KEEP_SYSTEMD_SERVICE=1
KillMode=control-group
RestartSec=5
