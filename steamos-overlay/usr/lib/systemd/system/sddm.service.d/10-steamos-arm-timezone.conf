[Service]
# Steam sets the timezone during first-run setup, after SDDM has started. SDDM
# compares config file times as local time, so a timezone change while it runs
# can make new sddm.conf.d changes look older than what it already loaded, and
# the Switch to Desktop / Game Mode session request is then ignored. Run the
# daemon in UTC; the user session does not inherit TZ from it.
Environment=TZ=UTC0
