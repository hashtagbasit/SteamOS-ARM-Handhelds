# Saved networks (hidden ones above all) didn't come back on their own after
# a reboot. NetworkManager scans with a random MAC by default, and hidden
# networks are only found by a directed probe from the MAC the AP knows; the
# profile then never autoconnects until it is removed and added again.
# Scan with the real address. (Cause per the Gen 5 report: saved profile is
# there, NM never tries it.)
[device]
wifi.scan-rand-mac-address=no
