# Swap is zram (compressed RAM, zstd), not a disk: under memory pressure,
# compress idle anonymous memory before dropping file pages. A game's files
# often live on a microSD (~12 MB/s), so a dropped page costs far more to
# read back than a zram page costs to decompress. The kernel's docs suggest
# >100 for in-memory swap.
# Measured on a Retroid Pocket Nova (Tomb Raider with a
# memory hog: swappiness 60 -> 150 cut memory stalls 171 -> 25 ms and raised
# the lowest second 43.6 -> 55.0 fps). page-cluster and MGLRU min_ttl_ms
# made it worse there, so they stay at the defaults.
vm.swappiness = 150
