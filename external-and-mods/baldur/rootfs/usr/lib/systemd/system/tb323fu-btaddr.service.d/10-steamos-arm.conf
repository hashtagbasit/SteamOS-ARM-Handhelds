[Unit]
# The board unit waits for sys-subsystem-bluetooth-devices-hci0.device, which
# timed out at boot (ledger S26) and held its job for 90 s. The udev rule
# 72-steamos-arm-btaddr.rules starts it when hci0 shows up instead.
Wants=
After=
Before=bluetooth.service
ConditionPathExists=/sys/class/bluetooth/hci0
[Service]
TimeoutStartSec=70
