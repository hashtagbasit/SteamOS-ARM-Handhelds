# SM8250 (865) handhelds: streams the qdsp6 DSP passes through untouched.
# It converts nothing, and the kernel fixes those backends at S16LE, 48 kHz,
# stereo; opened any other way the output is noise. UCM pins rate and
# channels but has no key for the sample format, so it is set here.
monitor.alsa.rules = [
  {
    # AYN Thor Lite: every PCM (speakers on MI2S, headphones, mic).
    matches = [
      { alsa.card_name = "AYN Thor Lite" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
  {
    # AYANEO Pocket MICRO 2: keep its outputs open. Each idle suspend powers
    # the headphone amp down and back up, and it pops every time.
    matches = [
      { node.name = "~alsa_output.*" alsa.card_name = "PocketMICRO2" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    # DisplayPort over USB-C (fourth PCM) on the Retroid and MANGMI boards.
    # mmap on that PCM stalls, and short periods underrun.
    matches = [
      { media.class = "Audio/Sink" api.alsa.path = "hw:RetroidPocket,3" }
      { media.class = "Audio/Sink" api.alsa.path = "hw:PocketMax,3" }
      { media.class = "Audio/Sink" api.alsa.path = "hw:AirYPro,3" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ "FL" "FR" ]
        api.alsa.disable-mmap = true
        api.alsa.period-size = 480
        api.alsa.period-num = 8
      }
    }
  }
  {
    # Retroid Pocket capture (headset and Flip 2 internal microphones):
    # opened at S24 it records noise while S16 on the same route is clean.
    matches = [
      { media.class = "Audio/Source" api.alsa.path = "hw:RetroidPocket,2" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
