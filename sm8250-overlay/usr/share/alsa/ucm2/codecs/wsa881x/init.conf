# WSA881x speaker amps: merge the two mono volume controls into one stereo
# "Speakers Volume". alsa-ucm-conf has no init.conf for this codec;
# every 865 use case includes it, so without
# this file the whole use case fails to load and no speaker shows up.
LibraryConfig.remap.Config {

	ctl.default.map {
		# Merge two mono controls into one stereo
		"name='Speakers Volume'" {
			"name='SpkrLeft PA Volume'".vindex.0 0
			"name='SpkrRight PA Volume'".vindex.1 0
		}
	}
}
